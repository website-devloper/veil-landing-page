name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job may read the repo and publish Pages, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `npm ci` installs exactly the locked tree — a lockfile mismatch fails
      # the build instead of silently resolving something new.
      - name: Install
        working-directory: app
        run: npm ci

      - name: Audit (production deps)
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # Pages serves this repo at /veil-landing-page/ — without a matching base
      # every asset resolves from the domain root and 404s.
      - name: Build
        working-directory: app
        env:
          VITE_BASE: /veil-landing-page/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
